# CI rapide (< 3 min), sans secret ni gros modèle ML.
#
# - backend  : `unittest discover` sur backend/test_*.py. DÉCOUVERTE AUTOMATIQUE
#              et non plus une liste de `run:` nommés — la liste avait laissé 4
#              fichiers de test sur 6 ne jamais tourner, sans que rien ne le
#              signale. Un nouveau `backend/test_*.py` est donc pris en compte
#              sans toucher à ce fichier.
#              Les deps ne sont pas minimales : plusieurs tests montent la vraie
#              app (TestClient), donc importent main.py — d'où numpy/ollama/
#              pypdf/watchdog/python-multipart. C'est l'ensemble des imports de
#              niveau module de main.py, mesuré — à UNE exception près, `wsproto`,
#              justifiée au-dessus de l'étape. `numpy` remplace `chromadb` depuis
#              le remplacement du store vectoriel : c'est core/vector_store.py,
#              importé par core/rag.py, qui en dépend.
#              `onnxruntime` EST installé ici depuis le 2026-08-26, et ce n'est
#              pas un relâchement de la règle « pas de deps ML » : la pile
#              d'embedding n'est plus torch + sentence-transformers (198 Mo de
#              wheels) mais onnxruntime seul — 14 Mo, une dépendance DIRECTE de
#              requirements.txt, embarquée dans le paquet livré. La garder hors
#              de ce job ferait tourner la CI dans une configuration qui
#              n'existe plus nulle part. Ce qui reste hors du job, c'est le
#              MODÈLE : `_test_env.py` pose EPURE_EMBEDDING_DIR sur un
#              temporaire vide et EPURE_EMBEDDING_AUTOINSTALL=0, donc aucun test
#              ne télécharge les 90 Mo de poids.
#              VERSIONS : `fastapi` et `starlette` sont épinglées sur
#              backend/requirements.txt. C'est la version validée qui fait foi,
#              pas la dernière publiée — l'inverse n'est pas un choix, c'est un
#              bump silencieux à chaque push. Ce fichier a d'ailleurs déjà
#              résolu du fastapi ≥ 0.137 et fait échouer les deux tests de route
#              fantôme (`AssertionError: 200 != 404`) là où le poste de dev, en
#              0.136.3, passait : le démontage de routes ne fonctionne plus
#              au-delà de 0.136 et le bug n'est PAS corrigé
#              (docs/limite-demontage.md). `test_versions_epinglees.py` tient la
#              frontière et vérifie que ces deux épinglages-ci ne divergent pas
#              de requirements.txt.
#              Le RESTE de la liste flotte, délibérément : rien n'y dépend d'un
#              interne de version, et recopier tout requirements.txt ici en
#              dupliquerait la maintenance.
#              Si un autre paquet devient porteur d'un invariant, il rejoint les
#              deux épinglés.
# - frontend : npm ci + tsc -b + npm test + npm run build + eslint — QUATRE
#              BLOQUANTS. Les trois premiers datent du 2026-08-08 ; `npm test`
#              (vitest + jsdom) est arrivé le 2026-08-23, après un TypeError en
#              production qu'aucun des trois autres ne pouvait voir — détail
#              au-dessus de l'étape. eslint tourne avec un cliquet
#              `--max-warnings $ESLINT_MAX_WARNINGS` (0 erreur, périmètre
#              src/ + catalogue installé) : la valeur est définie une seule
#              fois, en `env:` de workflow, et le détail est plus bas.
#              Le type-check est gardé EN PLUS du build, pour que le nom de
#              l'étape en échec dise tout de suite si c'est le typage ou le
#              bundling. Détail et durées mesurées au-dessus de l'étape.
# - integration : integration_modules_mount.py charge core.runtime et le vrai
#              store vectoriel → plus lourd que le job rapide, MANUEL
#              uniquement (workflow_dispatch). Son préfixe `integration_` est ce
#              qui l'exclut de la découverte du job backend.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CLIQUET ESLINT — SOURCE DE VERITE UNIQUE.
#
# Ce nombre vivait a trois endroits : l'en-tete de ce fichier, le commentaire
# au-dessus de l'etape, et l'etape elle-meme. Ils avaient deja diverge — le
# commentaire annoncait « au plus 63 » quand l'etape imposait 61. Un cliquet
# dont on ne sait plus lire la valeur ne cliquete plus.
#
# Il est ici, et non dans l'etape, pour que `tools/verif-ci.ps1` puisse le LIRE
# depuis ce fichier plutot que le recopier : un controle local qui recopierait
# le seuil finirait par mesurer autre chose que la CI, ce qui est exactement le
# defaut que ce script existe pour supprimer.
#
# Le nombre ne peut que BAISSER. Quiconque ajoute un avertissement casse la CI ;
# quiconque en resorbe descend le plafond dans le meme commit.
env:
  ESLINT_MAX_WARNINGS: "61"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests rapides
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # fastapi/starlette épinglés sur requirements.txt — voir en-tête. Ne pas
      # « rafraîchir » ces deux versions ici : elles ne se montent qu'avec
      # requirements.txt, et seulement après docs/limite-demontage.md.
      # `wsproto` sort du périmètre « imports de niveau module de main.py » : ce
      # n'en est pas un, et rien ici ne l'importe. Il est là pour que
      # `test_websocket_dependance.py` VÉRIFIE au lieu de se sauter — c'est
      # l'implémentation WebSocket d'uvicorn, dont l'absence a coûté tout
      # `/ws/*` dans un paquet livré. Le laisser hors de cette liste rendrait le
      # garde-fou vert par vacuité, exactement ce que ce dépôt a déjà payé avec
      # `tsc --noEmit` plus bas. Python pur, 25 ko, aucun transitif nouveau.
      #
      # `python-docx`, `python-pptx`, `openpyxl` : même raison exactement, et le
      # même piège évité. Ce sont les lecteurs de documents de `core/rag.py`, et
      # `test_ingestion_documents.py` FABRIQUE un .docx/.pptx/.xlsx réel pour
      # vérifier que le texte extrait correspond à la source. Sans eux ici, ces
      # tests se sauteraient (`find_spec` → absent) et la suite resterait verte
      # sur une extraction cassée. À noter que `python-docx` n'y était PAS alors
      # que le dépôt lit du .docx depuis longtemps : ce chemin n'était donc pas
      # couvert en CI, personne ne l'avait remarqué. Les trois sont py3-none-any,
      # sans extension compilée, +6,6 Mo — rien à voir avec les deps ML que cet
      # en-tête écarte.
      #
      # `openai` : le SDK du chemin FLM/cloud de `core/llm.py`, et son absence
      # ici ne produisait PAS un test sauté mais une ERREUR DE COLLECTE.
      # `test_raisonnement_stream.py` l'importe au NIVEAU MODULE (ligne 53,
      # `from openai.types.chat import ChatCompletionChunk`), donc le fichier
      # entier échouait à se charger : `FAILED (errors=1)`, exit 1, CI rouge sur
      # `main` à chaque push. `ollama`, importé à la ligne juste au-dessus, était
      # là depuis toujours — c'est le jumeau qui manquait.
      # Déclaré en direct dans requirements.txt (`openai==2.38.0`), donc « déjà
      # installé sur le poste de dev » masquait la lacune : l'écart local/CI de
      # l'en-tête, joué une fois de plus.
      # Pur Python côté SDK ; ses transitifs (anyio, distro, httpx, jiter,
      # pydantic, sniffio, tqdm, typing-extensions) ont tous des wheels
      # manylinux, et httpx/pydantic sont déjà dans cette liste. Rien à voir avec
      # les deps ML que cet en-tête écarte.
      #
      # `readability-lxml` : même piège que `openai` ci-dessus, rejoué à
      # l'identique. `core/webcontent.py` (contenu réel des pages en recherche
      # web, `eaa36b3`) l'importe SANS condition au niveau module, et
      # `modules/chat/router.py` importe `core.webcontent` au niveau module —
      # donc son absence ici n'a jamais donné un test sauté mais une ERREUR DE
      # COLLECTE sur tout fichier qui importe `modules.chat.router` ou
      # `TestClient(app)` (`test_chat_comparaison.py`, `test_chat_ws_conversation.py`,
      # `test_web_search.py`, `test_webcontent.py`, dix fichiers au total,
      # `FAILED (errors=1)` sur CHACUN) — CI rouge sur `main` depuis ce commit,
      # sans que rien ne le signale ailleurs qu'ici. `lxml` est déjà dans
      # l'arbre (tiré par `python-docx` juste en dessous) ; `cssselect`,
      # `chardet` et `lxml_html_clean` (transitif de `lxml[html-clean]`) sont
      # tous les trois py3-none-any, aucune extension compilée — même famille
      # que `python-docx`/`python-pptx`/`openpyxl` ci-dessous, rien à voir avec
      # les deps ML que cet en-tête écarte.
      - name: Dépendances (pas de deps ML — voir en-tête)
        run: >
          pip install fastapi==0.136.3 starlette==1.2.0
          pydantic pyyaml python-dotenv
          httpx python-multipart numpy ollama openai pypdf watchdog uvicorn wsproto
          python-docx python-pptx openpyxl onnxruntime readability-lxml
      - name: Tests unitaires (découverte automatique)
        working-directory: backend
        # Les tests forcent HF_HUB_OFFLINE=1 et neutralisent les sondes
        # Ollama/FLM : aucun accès réseau, aucun téléchargement de modèle.
        # subprocess.Popen est mocké là où il est testé. Les cas propres à
        # Windows (argv d'explorer, citation des chemins) se skippent d'eux-mêmes
        # sur ce runner Linux — ils restent à vérifier à la main.
        run: python -m unittest discover -s . -p 'test_*.py' -v

  frontend:
    name: Frontend — tsc + build + eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installation (npm ci)
        run: npm ci
      # `tsc -b` et NON `tsc --noEmit` : frontend/tsconfig.json est un fichier
      # « solution » ("files": [] + "references"), et hors mode -b tsc ne suit
      # pas les références. `--noEmit` ne lisait donc aucun fichier et sortait 0
      # quoi qu'il arrive — un gate vert par vacuité, pas par succès. Démontré :
      # sur un `const x: number = 'pas un nombre'` volontaire, `tsc --noEmit`
      # sort 0 sans rien afficher là où `tsc -b` sort 2 avec le TS2322.
      #
      # Étape gardée séparée du build plutôt que supprimée : son nom distinct
      # dans l'UI GitHub dit immédiatement si c'est le typage ou le bundling qui
      # a cassé, sans ouvrir les logs. Le double emploi coûte peu : `tsc -b`
      # écrit son .tsbuildinfo dans node_modules/.tmp, donc le `tsc -b` que
      # relance `npm run build` juste après est incrémental et ne refait pas le
      # travail de typage.
      #
      # Durées mesurées SUR LE RUNNER, par étape — ce sont des durées d'étape,
      # démarrage npm/node compris, pas le temps propre de l'outil :
      #   run 31261765846 (avant) : Type-check  1 s · Build 10 s
      #   run 31262794722 (après) : Type-check 10 s · Build  8 s
      # Le typage bascule d'une étape à l'autre ; l'étape Build ne garde que le
      # bundling (vite rapporte ~2,3 s) plus le démarrage npm. Coût net du gate
      # réel : +3 s sur le job (44 s → 47 s). L'ancien « ~15 s contre ~1 min »
      # de ce commentaire était inventé — d'où le détail des runs ici.
      - name: Type-check (bloquant)
        run: npx tsc -b
      # TESTS DE COMPOSANTS — vitest + jsdom, arrivés le 2026-08-23 pour une
      # raison précise : un `TypeError: Cannot read properties of undefined
      # (reading 'length')` en production, dans un chunk minifié, sur un rendu de
      # ModuleBar. Ni `tsc -b` ni eslint ne pouvaient le voir — la faute était un
      # `as` posé sur un `r.json()`, c'est-à-dire une affirmation de forme que le
      # compilateur croit sur parole. Le seul gate capable de dire non est un
      # RENDU du composant avec des réponses qui n'ont pas la forme annoncée.
      # Rapide (~3 s) : aucune raison de le réserver à un job manuel.
      - name: Tests de composants (bloquant)
        run: npm test
      # CATALOGUE — vérification après INSTALLATION SIMULÉE.
      #
      # Les composants de modules-catalogue/<id>/ ne sont compilés par personne
      # là où ils dorment : ils ne sont sous aucun `include` de tsconfig, et
      # leurs imports relatifs ne sont valides QU'À LEUR EMPLACEMENT INSTALLÉ
      # (frontend/src/modules/generated/<id>/, soit trois niveaux sous src/).
      # Les vérifier sur place est donc impossible — pas difficile, impossible :
      # un `../../../api` est faux tant que le fichier n'est pas à la bonne
      # profondeur. Les installer d'abord est la seule méthode correcte.
      #
      # Bénéfice secondaire, et il n'est pas mince : cette étape exécute
      # exactement l'opération que fera `POST /settings/catalogue/{id}/install`
      # — copier `modules-catalogue/<id>/Component.tsx` vers
      # `generated/<id>/`. La copie est donc testée en même temps que son
      # résultat.
      #
      # Ce gate n'est pas théorique : à son écriture il a immédiatement trouvé
      # que les six modules n'étaient pas installables (cf. 352d56e — cinq
      # composants avaient gardé la profondeur d'imports de leur ancien
      # emplacement, TS2307 sur tous leurs imports).
      #
      # `if: always()` sur le nettoyage : sans lui, un échec de tsc laisserait
      # les copies en place et l'étape Build suivante ne vérifierait plus src/
      # seul mais src/ + catalogue — elle mesurerait autre chose que son nom.
      - name: Catalogue — installation simulée
        run: |
          set -euo pipefail
          for d in ../modules-catalogue/*/; do
            id=$(basename "$d")
            mkdir -p "src/modules/generated/$id"
            cp "$d/Component.tsx" "src/modules/generated/$id/Component.tsx"
            echo "installé : $id"
          done
      - name: Catalogue — type-check + build après installation
        run: |
          set -euo pipefail
          rm -rf node_modules/.tmp   # tsc -b est incrémental : forcer la relecture
          npx tsc -b
          npm run build
      - name: Catalogue — désinstallation
        if: always()
        run: |
          set -euo pipefail
          for d in ../modules-catalogue/*/; do
            rm -rf "src/modules/generated/$(basename "$d")"
          done
          rm -rf node_modules/.tmp
          git diff --exit-code --stat -- src/modules/generated || {
            echo "::error::la désinstallation n'a pas rendu generated/ à son état d'origine"
            exit 1
          }
      - name: Build (bloquant)
        # Le type-check ne voit pas les erreurs de bundling. Or le TSX généré
        # par l'Atelier atterrit dans frontend/src/modules/generated/, inclus
        # dans tsconfig.app.json ("include": ["src"]) : un module généré qui ne
        # bundle pas cassait l'image frontend sans que la CI le voie.
        run: npm run build
      # CLIQUET. eslint est bloquant : 0 erreur tolérée, et au plus
      # `ESLINT_MAX_WARNINGS` avertissements — la valeur est en `env:` de
      # workflow, en haut de ce fichier, et NULLE PART AILLEURS. Ce
      # commentaire a annoncé « 63 » pendant que l'étape imposait 61 :
      # c'est pour ça qu'il ne porte plus de nombre.
      # Le nombre ne peut que baisser — quiconque en ajoute un
      # casse la CI, et quiconque en résorbe doit descendre le plafond dans le
      # même commit. C'est ce qui empêche la dette de regrimper en silence, ce
      # que `continue-on-error: true` avait laissé faire pendant des mois.
      #
      # PÉRIMÈTRE : `src/` **plus le catalogue installé**. Le lint tourne donc
      # sur une seconde installation simulée, pour la même raison que le
      # type-check plus haut — un composant de catalogue n'est lintable qu'une
      # fois à sa profondeur d'installation.
      #
      # Le plafond était repassé de 36 à 63 en rétablissant le périmètre (le 36
      # décrivait une CI qui ne regardait plus que la moitié du code : les 27
      # avertissements des six composants n'avaient pas été résorbés, ils étaient
      # sortis du champ — un cliquet qui descend parce qu'on a cessé de regarder
      # ne mesure plus rien). Il redescend à 61 avec l'UI du catalogue : ses
      # gestionnaires sont écrits en fonctions simples plutôt qu'en useCallback,
      # ce qui retire deux exhaustive-deps au passage.
      #
      # Les 61 se décomposent en deux populations à ne pas confondre :
      #   41 react-hooks/exhaustive-deps — faux positifs. eslint ne peut pas
      #      voir à travers usePersistentState que le setter retourné est celui
      #      de useState, donc stable ; il exige des dépendances inutiles.
      #   20 react-hooks/{refs,set-state-in-effect,immutability} — VRAIES
      #      violations des Rules of React, passées en « warn » dans
      #      eslint.config.js faute de tests frontend pour rattraper une
      #      régression. Le prérequis (vitest + testing-library) EXISTE depuis
      #      le 2026-08-23 : il reste à écrire les tests, en commençant par
      #      usePersistentState.ts. Voir CHANGELOG.md, « dette assumée ».
      - name: eslint — installation simulée du catalogue
        run: |
          set -euo pipefail
          for d in ../modules-catalogue/*/; do
            id=$(basename "$d")
            mkdir -p "src/modules/generated/$id"
            cp "$d/Component.tsx" "src/modules/generated/$id/Component.tsx"
          done
      # Le nombre n'est pas dans le `name:` : le contexte `env` n'y est pas
      # disponible, un nombre écrit là repartirait donc en copie divergente.
      - name: eslint (bloquant — cliquet ESLINT_MAX_WARNINGS, src + catalogue)
        run: npm run lint -- --max-warnings "$ESLINT_MAX_WARNINGS"
      - name: eslint — désinstallation du catalogue
        if: always()
        run: |
          set -euo pipefail
          for d in ../modules-catalogue/*/; do
            rm -rf "src/modules/generated/$(basename "$d")"
          done

  integration:
    name: Intégration — montage de tous les modules (manuel)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dépendances complètes (requirements.txt, voix comprise)
        run: pip install -r backend/requirements.txt
      - name: Montage de tous les modules (integration_modules_mount.py)
        working-directory: backend
        # Le test force HF_HUB_OFFLINE=1 lui-même : aucun téléchargement de
        # modèle HF, les moteurs lourds restent paresseux (_LazyEngine).
        run: python integration_modules_mount.py

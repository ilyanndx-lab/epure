# CI rapide (< 3 min), sans secret ni gros modèle ML.
#
# - backend  : `unittest discover` sur backend/test_*.py. DÉCOUVERTE AUTOMATIQUE
#              et non plus une liste de `run:` nommés — la liste avait laissé 4
#              fichiers de test sur 6 ne jamais tourner, sans que rien ne le
#              signale. Un nouveau `backend/test_*.py` est donc pris en compte
#              sans toucher à ce fichier.
#              Les deps ne sont pas minimales : plusieurs tests montent la vraie
#              app (TestClient), donc importent main.py — d'où chromadb/ollama/
#              pypdf/watchdog/python-multipart. C'est exactement l'ensemble des
#              imports de niveau module de main.py, mesuré, et il n'inclut PAS
#              torch/sentence-transformers (le préchauffage RAG de core.runtime
#              tourne dans un thread et échoue proprement).
# - frontend : npm ci + tsc --noEmit (bloquant) + npm run build (bloquant) +
#              eslint (non bloquant : ~94 erreurs préexistantes de règles
#              react-hooks strictes sur tout le codebase ; à re-rendre bloquant
#              après résorption de la dette, cf. CHANGELOG).
#              `tsc --noEmit` est gardé EN PLUS du build : il échoue en ~15 s là
#              où le build échoue en ~1 min, et le message est plus direct.
# - integration : integration_modules_mount.py charge core.runtime (torch,
#              chromadb…) → trop lourd pour chaque push, déclenchement MANUEL
#              uniquement (workflow_dispatch). Son préfixe `integration_` est ce
#              qui l'exclut de la découverte du job backend.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests rapides
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances (pas de deps ML — voir en-tête)
        run: >
          pip install fastapi pydantic pyyaml python-dotenv
          httpx python-multipart chromadb ollama pypdf watchdog
      - name: Tests unitaires (découverte automatique)
        working-directory: backend
        # Les tests forcent HF_HUB_OFFLINE=1 et neutralisent les sondes
        # Ollama/FLM : aucun accès réseau, aucun téléchargement de modèle.
        # subprocess.Popen est mocké là où il est testé. Les cas propres à
        # Windows (argv d'explorer, citation des chemins) se skippent d'eux-mêmes
        # sur ce runner Linux — ils restent à vérifier à la main.
        run: python -m unittest discover -s . -p 'test_*.py' -v

  frontend:
    name: Frontend — tsc + build + eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installation (npm ci)
        run: npm ci
      - name: Type-check (bloquant)
        run: npx tsc --noEmit
      - name: Build (bloquant)
        # `tsc --noEmit` ne voit pas les erreurs de bundling. Or le TSX généré
        # par l'Atelier atterrit dans frontend/src/modules/generated/, inclus
        # dans tsconfig.app.json ("include": ["src"]) : un module généré qui ne
        # bundle pas cassait l'image frontend sans que la CI le voie.
        run: npm run build
      - name: eslint (non bloquant — dette préexistante, voir en-tête)
        run: npm run lint
        continue-on-error: true

  integration:
    name: Intégration — montage de tous les modules (manuel)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dépendances complètes (torch, chromadb…)
        run: pip install -r backend/requirements.txt
      - name: Montage de tous les modules (integration_modules_mount.py)
        working-directory: backend
        # Le test force HF_HUB_OFFLINE=1 lui-même : aucun téléchargement de
        # modèle HF, les moteurs lourds restent paresseux (_LazyEngine).
        run: python integration_modules_mount.py

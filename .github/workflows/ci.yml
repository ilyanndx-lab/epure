# CI rapide (< 3 min), sans secret ni gros modèle ML.
#
# - backend  : validateur AST, confinement de chemin, surface d'auth HTTP.
#              test_auth_surface.py monte la vraie app (TestClient), donc il
#              importe main.py : d'où chromadb/ollama/pypdf/watchdog/
#              python-multipart en plus des deps minimales — c'est exactement
#              l'ensemble des imports de niveau module de main.py, mesuré, et
#              il n'inclut PAS torch/sentence-transformers (le préchauffage RAG
#              de core.runtime tourne dans un thread et échoue proprement).
# - frontend : npm ci + tsc --noEmit (bloquant) + eslint (non bloquant : ~94
#              erreurs préexistantes de règles react-hooks strictes sur tout le
#              codebase ; à re-rendre bloquant après résorption de la dette).
# - integration : test_modules_mount.py charge core.runtime (torch, chromadb…)
#              → trop lourd pour chaque push, déclenchement MANUEL uniquement
#              (workflow_dispatch).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests rapides
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances (pas de deps ML — voir en-tête)
        run: >
          pip install fastapi pydantic pyyaml python-dotenv
          httpx python-multipart chromadb ollama pypdf watchdog
      - name: Gate de sécurité des routers (test_module_validate.py)
        working-directory: backend
        run: python test_module_validate.py
      - name: Confinement de chemin (test_safe_path.py)
        working-directory: backend
        run: python test_safe_path.py
      - name: Surface d'authentification HTTP (test_auth_surface.py)
        working-directory: backend
        # Le test force HF_HUB_OFFLINE=1 et neutralise les sondes Ollama/FLM :
        # aucun accès réseau, aucun téléchargement de modèle.
        run: python test_auth_surface.py

  frontend:
    name: Frontend — tsc + eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installation (npm ci)
        run: npm ci
      - name: Type-check (bloquant)
        run: npx tsc --noEmit
      - name: eslint (non bloquant — dette préexistante, voir en-tête)
        run: npm run lint
        continue-on-error: true

  integration:
    name: Intégration — montage de tous les modules (manuel)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dépendances complètes (torch, chromadb…)
        run: pip install -r backend/requirements.txt
      - name: Montage de tous les modules (test_modules_mount.py)
        working-directory: backend
        # Le test force HF_HUB_OFFLINE=1 lui-même : aucun téléchargement de
        # modèle HF, les moteurs lourds restent paresseux (_LazyEngine).
        run: python test_modules_mount.py

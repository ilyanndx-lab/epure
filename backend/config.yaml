model:
  name: qwen2.5:7b
  n_ctx: 4096
  # Timeout des appels au client Ollama, en secondes (défaut du code : 60).
  # C'est le délai d'attente ENTRE DEUX PAQUETS, pas la durée totale : il doit
  # couvrir le chargement à froid d'un modèle (plusieurs minutes pour un 7B sur
  # disque lent), sinon le premier message après le démarrage échoue. La panne
  # « Ollama figé » reste détectée par le timeout de connexion (5 s, non
  # configurable) et par la sonde de /health.
  timeout_s: 300

generation:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 2048
  # Plafond utilisé quand le raisonnement est actif.
  #
  # `num_predict` (Ollama) et `max_tokens` (API compatible OpenAI) sont des
  # plafonds UNIQUES : la réflexion et la réponse y puisent au même endroit, et
  # aucune des deux API n'expose de quota dédié à la réflexion. Un modèle qui
  # pense longtemps peut donc épuiser le budget AVANT d'écrire sa réponse —
  # mesuré chez un destinataire : 613 tokens d'entrée, 2048 produits, réponse
  # finale VIDE.
  #
  # 2048 avait été dimensionné pour une réponse seule, avant que des modèles à
  # raisonnement soient utilisables ici. Quand la réflexion est active, le
  # plafond doit couvrir DEUX productions.
  #
  # Conséquence assumée : ce plafond s'applique dès l'appel, donc aussi aux
  # modèles qui ne pensent pas (le raisonnement est actif par défaut). Ça ne leur
  # coûte rien — `num_predict` est un plafond, pas une allocation : un modèle qui
  # a fini s'arrête. Le seul effet est qu'une réponse longue n'est plus coupée à
  # 2048.
  max_tokens_raisonnement: 4096

rag:
  # Réglages techniques uniquement. Les dossiers de fiches (racine +
  # watch_folders) sont désormais pilotés par la config d'instance
  # (backend/memory/instance_config.json, éditable depuis Réglages).
  chunk_size: 500
  chunk_overlap: 50
  n_results: 3

voice:
  whisper_model: small
  piper_voice: fr_FR-upmc-medium
  language: fr

vision:
  # Modèle Ollama utilisé pour décrire une image du corpus (schémas, texte
  # photographié) quand FLM (le chemin NPU, cf. core/models.py:FLM_MODELS_STATIC)
  # n'est pas disponible sur ce poste — cas d'une machine ARM64 sans NPU AMD.
  # Même registre que model.name : le nom se change ici, jamais en dur dans le
  # code (core/models.py:premier_modele_vision_disponible).
  ollama_model: moondream